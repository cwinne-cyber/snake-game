function place(){food=[];for(const kind of kinds){let free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p.x===x&&p.y===y)&&!food.some(p=>p.x===x&&p.y===y))free.push({x,y});if(free.length)food.push({...free[Math.floor(Math.random()*free.length)],kind})}}

let audio=null, soundOn=true, master=null;
function unlockAudio(){if(!soundOn)return;try{if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC();master=audio.createGain();master.gain.value=.65;master.connect(audio.destination)}if(audio.state==='suspended')audio.resume().catch(()=>{});}catch(e){}}
function tone(f,g,d,offset=0,type='square',volume=.09){if(!soundOn||!audio||audio.state!=='running')return;const t=audio.currentTime+offset,o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(g,t+d);v.gain.setValueAtTime(.001,t);v.gain.linearRampToValueAtTime(volume,t+.012);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(master);o.start(t);o.stop(t+d+.01)}
function sound(kind){if(kind==='broccoli'){tone(523,523,.10);tone(784,784,.16,.10)}else if(kind==='smile'){[523,659,784,1047].forEach((f,i)=>tone(f,f,.12,i*.09))}else if(kind==='orange'){for(let i=0;i<5;i++){tone(180-i*15,55,.15,i*.075,'sawtooth',.07);tone(85,38,.12,i*.075,'triangle',.12)}}else if(kind==='virus'){tone(115,43,.48,0,'sawtooth',.12);tone(70,32,.37,.08,'triangle',.14);tone(290,130,.10,.42,'square',.04)}else if(kind==='over'){[349.23,329.63,311.13,293.66].forEach((f,i)=>{const d=i===3?1.25:.32;const t=.15+i*.43;tone(f*1.035,f*.98,d,t,'sawtooth',.11);tone(f/2,f/2*.98,d,t,'triangle',.07)})}else if(kind==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,f,.20,i*.14))}}
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent='Sound: '+(soundOn?'on':'off');$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)unlockAudio();if(master)master.gain.value=soundOn?.65:0;};

let reaction=null, slime=null;
function react(kind,h){sound(kind);reaction={kind,x:h.x*S+12,y:h.y*S+12,dx:dir[0],dy:dir[1],at:performance.now()};}
function effects(){if(!reaction)return;const r=reaction,t=(performance.now()-r.at)/850;if(t>=1){reaction=null;return}const bad=r.kind==='orange'||r.kind==='virus';if(snake.length){const h=snake[0],x=h.x*S,y=h.y*S;ctx.fillStyle=bad?(r.kind==='virus'?'#80509c':'#668b22'):'#386b25';ctx.fillRect(x+1,y+1,22,22);ctx.fillStyle='#172514';ctx.fillRect(x+5,y+5,4,4);ctx.fillRect(x+15,y+5,4,4);if(bad){ctx.fillRect(x+9,y+13,7,6)}else{ctx.fillRect(x+5,y+13,3,3);ctx.fillRect(x+8,y+16,9,3);ctx.fillRect(x+17,y+13,3,3)}}for(let i=0;i<6;i++){let d=10+t*(24+i*5), spread=(i-2.5)*7*t;let x=Math.round(r.x+r.dx*d-r.dy*spread),y=Math.round(r.y+r.dy*d+r.dx*spread);ctx.fillStyle=r.kind==='orange'?'#507d17':r.kind==='virus'?'#8845a2':'#d54d63';if(bad){ctx.fillRect(x,y,5,5);if(r.kind==='virus'){ctx.fillStyle='#a9ba7c';ctx.fillRect(x+1,y+1,3,3)}}else{ctx.fillRect(x-3,y,3,3);ctx.fillRect(x+1,y,3,3);ctx.fillRect(x-3,y+3,7,3);ctx.fillRect(x-1,y+6,3,2)}}ctx.fillStyle='#26371d';ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillText(r.kind==='orange'?'BLEH!':r.kind==='virus'?'BURP!':'YUM!',Math.max(28,Math.min(452,r.x)),Math.max(15,r.y-18-t*12));ctx.textAlign='start'}
function animate(){if(slime!==null){draw();drawSlime();}else if(reaction&&!paused)draw();requestAnimationFrame(animate)}
